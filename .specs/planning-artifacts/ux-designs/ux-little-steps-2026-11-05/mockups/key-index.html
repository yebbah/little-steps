<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key screens</title>
<style>
/* Review board for the LittleSteps key-screen mocks (Playroom direction, flat). Offline; no JS; no network.
   Governs: nothing on its own. Each mock's <style> header lists its DESIGN.md / EXPERIENCE.md sections
   (both status final; the spines win on any conflict with a mock).
   Contents: Today (light + dark), Prep (light + dark, full scroll length), Practice + Coach Tip sheet
   (light + dark, four columns), Review + Today after Save (light).
   Contrast (presentation only): ink #23252B on board #E3E0DA 11.63; caption #4A4E58 on board 6.32;
   link #33457F on board 6.94. Focus ring 2px #33457F + 2px offset on links. Root font 100%. */
*{box-sizing:border-box;margin:0}
html{font-size:100%}
@supports (font: -apple-system-body){html{font:-apple-system-body}}
body{background:#E3E0DA;color:#23252B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
h1{font-size:1.5rem;font-weight:800;line-height:1.15}
p{font-size:.8125rem;color:#4A4E58;margin-top:4px;line-height:1.4}
.row{display:flex;gap:24px;overflow-x:auto;margin-top:24px;padding-bottom:16px;align-items:flex-start}
figure{flex:none;display:flex;flex-direction:column;gap:8px}
figcaption a{color:#33457F;font-size:.9375rem;font-weight:700}
a:focus-visible{outline:2px solid #33457F;outline-offset:2px;border-radius:4px}
iframe{border:1px solid #D9DCE6;border-radius:20px;background:#E3E0DA}
</style></head><body>
<main>
<h1>LittleSteps key screens (Playroom, flat)</h1>

<figure><figcaption><a href="key-practice.html">3. Practice and Coach Tips (light and dark)</a></figcaption><iframe src="key-practice.html" width="920" height="2000" title="Practice and Coach Tip sheet, light and dark"></iframe></figure>
<figure><figcaption><a href="key-review.html">4. Review and after Save</a></figcaption><iframe src="key-review.html" width="920" height="2060" title="Review form and Today after Save"></iframe></figure>
</div></main></body></html>
