# Written exceptions for vulnerabilities that have NO fixed version yet (AD-25).
# An exception never covers a finding that has a fix: upgrade instead.
# Every entry needs all four fields. `expires` is YYYY-MM-DD, not in the past and at most
# 30 days from today. An expired or malformed entry fails the whole scan.
# Every active exception is listed in the epic's release note.
#
# exceptions:
#   - cve: CVE-2099-0001
#     reason: No fixed version published by the maintainer.
#     mitigation: The vulnerable code path is not reachable (feature disabled).
#     expires: 2099-01-30
#
# Story 1.3: Debian base packages in dhi.io/keycloak:26.8.2 (the newest tag on 2026-11-06).
# Renew or remove these by 2026-12-04, as soon as DHI publishes a newer Keycloak digest.
# Tracked in the `deferred` GitHub issue for this set (see docs/deferred-items.md); the issue's target date is the same as `expires`. Issue: #56.
