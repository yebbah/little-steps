# Local stack (Story 1.3): PostgreSQL, Keycloak, Mailpit.
#   cp deploy/local.env.example deploy/local.env     # then edit the values
#   docker compose --env-file deploy/local.env -f deploy/compose.yaml up -d --wait
# Image references are literal name:tag@digest and must match deploy/images.yaml
# (checked by deploy/check-images.sh). The app service is built, not pulled: it is in profile `full`
# (deploy/dev-up.sh --full), and deploy/Dockerfile's FROM lines are checked against the manifest too.
name: littlesteps

services:
  postgres:
    image: dhi.io/postgres:18-alpine@sha256:fec65236f2c8f14780ce38ac01f524449c730155fc342bfb88bc51f4a22e090d
    environment:
      POSTGRES_DB: ${LS_POSTGRES_DB:?Copy deploy/local.env.example to deploy/local.env}
      POSTGRES_USER: ${LS_POSTGRES_USER:?Copy deploy/local.env.example to deploy/local.env}
      POSTGRES_PASSWORD: ${LS_POSTGRES_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
    ports:
      - "127.0.0.1:${LS_POSTGRES_PORT:?Copy deploy/local.env.example to deploy/local.env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${LS_POSTGRES_USER}", "-d", "${LS_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the keycloak role and schema (the DHI image has no initdb.d hook).
  keycloak-db-init:
    image: dhi.io/postgres:18-alpine@sha256:fec65236f2c8f14780ce38ac01f524449c730155fc342bfb88bc51f4a22e090d
    entrypoint: ["/bin/sh", "/init/keycloak-schema.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${LS_POSTGRES_USER:?Copy deploy/local.env.example to deploy/local.env}
      PGPASSWORD: ${LS_POSTGRES_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
      PGDATABASE: ${LS_POSTGRES_DB:?Copy deploy/local.env.example to deploy/local.env}
      KC_DB_USER: ${LS_KEYCLOAK_DB_USER:?Copy deploy/local.env.example to deploy/local.env}
      KC_DB_PASSWORD: ${LS_KEYCLOAK_DB_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
    volumes:
      - ./postgres/init:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: dhi.io/keycloak:26.8.2@sha256:aeda9dd828bc6760a29f14365d5ef9b6cd56ac0c7b90ab9dd0384b8bbf341aa0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LS_KEYCLOAK_ADMIN:?Copy deploy/local.env.example to deploy/local.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LS_KEYCLOAK_ADMIN_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${LS_POSTGRES_DB:?Copy deploy/local.env.example to deploy/local.env}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${LS_KEYCLOAK_DB_USER:?Copy deploy/local.env.example to deploy/local.env}
      KC_DB_PASSWORD: ${LS_KEYCLOAK_DB_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
      KC_HEALTH_ENABLED: "true"
      # Read by the realm import (${VAR} placeholders in littlesteps-realm.json).
      LS_CAREGIVER_A_PASSWORD: ${LS_CAREGIVER_A_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
      LS_CAREGIVER_B_PASSWORD: ${LS_CAREGIVER_B_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
      LS_TAILSCALE_HOST: ${LS_TAILSCALE_HOST:?Copy deploy/local.env.example to deploy/local.env}
    ports:
      - "127.0.0.1:${LS_KEYCLOAK_PORT:?Copy deploy/local.env.example to deploy/local.env}:8080"
    volumes:
      - ./keycloak/littlesteps-realm.json:/opt/keycloak/data/import/littlesteps-realm.json:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    # The DHI image has bash but no curl: speak HTTP over /dev/tcp to the management port.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          IFS= read -r line <&3 && case "$$line" in *' 200 '*) true ;; *) false ;; esac
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:${LS_MAILPIT_UI_PORT:?Copy deploy/local.env.example to deploy/local.env}:8025"
      - "127.0.0.1:${LS_MAILPIT_SMTP_PORT:?Copy deploy/local.env.example to deploy/local.env}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The app as it ships (Story 1.5): the PWA and the Spring Boot app in one non-root image.
  # Only with the `full` profile: docker compose --profile full up -d app
  app:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      LS_DB_HOST: postgres
      LS_POSTGRES_PORT: "5432"
      LS_POSTGRES_DB: ${LS_POSTGRES_DB:?Copy deploy/local.env.example to deploy/local.env}
      LS_POSTGRES_USER: ${LS_POSTGRES_USER:?Copy deploy/local.env.example to deploy/local.env}
      LS_POSTGRES_PASSWORD: ${LS_POSTGRES_PASSWORD:?Copy deploy/local.env.example to deploy/local.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LS_APP_PORT:-8080}:8080"
    restart: unless-stopped

  # P2 (Epic 18): Presidio. Uncomment when the privacy pipeline arrives.
  # presidio-analyzer:
  #   image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.366-distroless@sha256:84cb78c12a26d7ff4d2f5b980452dd9983c0a5c8c56ee410226bb6bb3f19f7d8
  # presidio-anonymizer:
  #   image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.366-distroless@sha256:cf356326f0c9ed1a90b85973976066ff897973d6d495e4f56aa4cba4f351996b

volumes:
  postgres-data:
