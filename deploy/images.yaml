# Image manifest (AD-26). Every image the stack uses, pinned by digest.
# Fields: name, source (dhi | other), tag, digest, and a reason for every `other`.
# Keep `name:` before `digest:` in each entry: deploy/security-scan.sh images parses that order.
# deploy/check-images.sh fails when compose.yaml and this file disagree.
# `scan: deferred` skips the image in deploy/security-scan.sh (it still has to match compose via check-images.sh).
# Use it only for images that do not run yet; each one needs a `deferred` issue
# (docs/deferred-items.md). Remove it when the image is enabled.
# node and eclipse-temurin appear more than once: the -dev entries are the Dockerfile build stages (Story 1.5),
# the plain eclipse-temurin entry is the runtime. Build stages are scanned like every other image; the
# alpine -dev variants were chosen because they pass the blocking rule (the Debian ones do not).
# Digests are the multi-arch index digests, read 2026-11-06.
