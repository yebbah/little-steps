spring.application.name=littlesteps

# Actuator: expose only the health endpoint, and never its details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# All configuration comes from the environment, with no defaults for credentials. Profiles: local, test, prod.
# The database settings are not set here: without a profile the app does not start (no datasource).

# Persistence: Flyway owns the schema (AD-20); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Spring Modulith event publication registry (AD-1): incomplete publications are resubmitted at startup.
spring.modulith.events.republish-outstanding-events-on-restart=true

# Logs: structured JSON on stdout, with the request ID from the logging context (AD-19).
# Only IDs, enums, durations and counts are logged: never request or response bodies.
logging.structured.format.console=ecs

# API contract (AD-20). springdoc is off by default; the build turns it on to write openapi.json.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
