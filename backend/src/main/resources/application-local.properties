# Local development: values come from deploy/local.env through the environment (never hard-coded here).
# Inside compose the app reaches the database at host `postgres`; on the host use localhost and LS_POSTGRES_PORT.
spring.datasource.url=jdbc:postgresql://${LS_DB_HOST:localhost}:${LS_POSTGRES_PORT:5432}/${LS_POSTGRES_DB}
spring.datasource.username=${LS_POSTGRES_USER}
spring.datasource.password=${LS_POSTGRES_PASSWORD}
