<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LittleSteps">
  <!-- Three play blocks climbing like steps: a simple object drawing in the Playroom style. No people, no faces, no shadows.
       Colours are the action colour and three Domain tints from DESIGN.md. Content stays inside the central 80% so
       a maskable crop never cuts it. -->
  <rect width="512" height="512" fill="#33457F"/>
  <rect x="96" y="288" width="96" height="96" rx="20" fill="#FCE3CC"/>
  <rect x="208" y="208" width="96" height="176" rx="20" fill="#D6EEDC"/>
  <rect x="320" y="128" width="96" height="256" rx="20" fill="#F7DCE6"/>
</svg>
