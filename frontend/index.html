<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191F" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LittleSteps</title>
    <!-- Applies the stored Light / Dark choice before first paint, so there is no flash of the wrong
         theme. Same storage key as src/styles/theme.ts (a test keeps them equal). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('littlesteps.theme')
          if (theme !== 'light' && theme !== 'dark') return
          document.documentElement.setAttribute('data-theme', theme)
          // The browser bar follows the choice too (src/styles/theme.ts does the same after load). The two
          // colours are the floor tokens; a test keeps them equal to tokens.css.
          try {
            var bars = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < bars.length; i++) {
              if (!bars[i].getAttribute('data-original')) bars[i].setAttribute('data-original', bars[i].getAttribute('content'))
              bars[i].setAttribute('content', theme === 'dark' ? '#17191F' : '#FAF7F2')
            }
          } catch (e) {}
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
